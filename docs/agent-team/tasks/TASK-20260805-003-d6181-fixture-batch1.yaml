fixture_designs:
  - id: email_classify_014
    suite: email_classify
    theme: 英文 invoice reminder + 附件
    body_outline: |
      From: billing@vendor-example.com
      Subject: Invoice INV-2026-0418 reminder - payment due in 7 days
      Attachment: invoice_2026_0418.pdf(2.3 MB)
      Body: 英文商务 invoice reminder;明确提到附件 invoice_2026_0418.pdf;无 PII。
    expected_label: invoice_payment_request(与 006 同类;新增英文场景)
    deidentify:
      - 保留域 vendor-example.com
      - invoice 号 INV-2026-XXXX(已脱敏)
      - attachment 大小使用 round 数字(2.3 MB,无长数字)
  - id: email_classify_015
    suite: email_classify
    theme: "Re: Fw: 三层链 meeting reschedule"
    body_outline: |
      Subject: "Re: Fw: [external] meeting reschedule - slot conflict Tue"
      Body: "多轮 Re: Fw: chain,中文正文,提议改期;无 PII;中英混排。"
    expected_label: meeting_reschedule_proposal(与 004 同类;新增多轮上下文)
    deidentify:
      - 保留域 example.com
      - 无长数字(日期仅 ISO 简短形式)
  - id: email_draft_010
    suite: email_draft
    theme: 英文 vendor delay apology
    body_outline: |
      Recipient: support@vendor-example.com
      Tone: 英文正式道歉 + 解释延迟 + 给出新 ETA
      Body: I apologize for the delay in delivery... new ETA is next Friday.
    expected_tone: apology_late_reply(与 002 同类;新增英文场景)
    deidentify:
      - 保留域 vendor-example.com
      - ETA 用 "next Friday",避免具体长数字日期
  - id: email_draft_011
    suite: email_draft
    theme: "Re: invoice query with attachment note"
    body_outline: |
      Recipient: billing@vendor-example.com
      Tone: "中文 + 礼貌 + 多轮 Re: + 附件说明"
      Body: "Re: 关于 INV-2026-0418 的疑问... 请查收附件清单附件说明.pdf。"
    expected_tone: invoice_query_polite(与 004 同类;新增多轮 + 附件说明)
    deidentify:
      - 保留域 vendor-example.com
      - attachment 名称 附件说明.pdf(中文文件名,无长数字)
  - id: sap_troubleshoot_009
    suite: sap_troubleshoot
    theme: M8 113 科目错误 + 短转储文本
    body_outline: |
      Symptom: 过账时报错 M8 113 "Account 670000 requires an assignment"
      Short dump excerpt: short text only, ≤10 行;无完整转储内容;无客户名/凭证号。
    expected_action: 提示检查科目 670000 分配/成本中心;不直接修改生产配置
    deidentify:
      - 科目 670000(占位)
      - 转储文本不含客户名/凭证号
      - 短转储控制在 ≤10 行
