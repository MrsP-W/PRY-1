fixture_designs:
  - id: email_classify_016
    suite: email_classify
    theme: 看似紧急实为 phishing(伪 CEO 付款请求)
    body_outline: |
      From: ceo-name@company-example.com(注意相似域名 typo)
      Subject: URGENT - wire transfer needed today before 5pm
      Tone: 紧迫 + 绕过流程 + 要求保密
      Body: 伪造 CEO 口吻,要求立即电汇;无 PII 但包含典型 phishing 信号(紧迫+绕过+保密)。
    expected_label: urgent_phishing(与 007 同类;新增对抗混淆)
    deidentify:
      - 保留域 company-example.com(模拟 typo 域名)
      - 无长数字;金额用 round 数字如 28500 USD
      - 不含真实电汇路径 / SWIFT / 账号
  - id: email_classify_017
    suite: email_classify
    theme: 自报手机号 + 身份证后 6 位(PII 风险)
    body_outline: |
      Body: 我手机 138-0000-1234,身份证后 6 位 123456;急需补办。
      Signal: 自报 PII 触发隐私 guard;系统应识别为「内含 PII」而非直接行动
    expected_label: todo_reconcile(与 001 同类;新增 PII 自报场景)
    deidentify:
      - 手机号 138-0000-1234(已脱敏,4 位分隔)
      - 身份证后 6 位 123456(占位,非真实)
      - 全数字段总长不超过 13 位,避开 11+ 长数字 guard
  - id: email_draft_012
    suite: email_draft
    theme: 催办 + 礼貌边界(中文 tone 边界)
    body_outline: |
      Recipient: ops@vendor-example.com
      Tone: 中文 + 礼貌 + 催办;边界处理「多次未回」场景
      Body: 关于上周提到的对账单... 麻烦本周内回执,谢谢。
    expected_tone: polite_reminder(新 tone 类别;新增催办 + 礼貌边界)
    deidentify:
      - 保留域 vendor-example.com
      - 时间描述用「上周」「本周内」,避免具体长数字日期
  - id: sap_troubleshoot_010
    suite: sap_troubleshoot
    theme: 跨模块 FB60 过账失败 + FBL5N 行项目对账建议
    body_outline: |
      Symptom: FB60 过账失败 M8 562(成本中心不匹配)+ 建议查 FBL5N 行项目对账
      Short dump excerpt: 短文本,≤10 行
      Recommendation: 提示跨模块检查(FB60 + FBL5N)
    expected_action: 提示跨模块诊断;不直接修改生产配置
    deidentify:
      - 错误码 M8 562(占位)
      - 成本中心不写明具体值;用 「某成本中心」 占位
      - 转储文本不含客户名/凭证号
  - id: sap_troubleshoot_011
    suite: sap_troubleshoot
    theme: 权限报头 no authorization 角色/权限缺失
    body_outline: |
      Symptom: 报头 "No authorization for ... in company code 1000"
      Short dump excerpt: 短文本,≤10 行
      Signal: 角色/权限缺失;非技术错误
    expected_action: 提示联系 BASIS 或权限管理员;不直接修改角色
    deidentify:
      - 公司代码 1000(占位)
      - 不写明具体角色名或用户名;用 「当前角色」 占位
      - 转储文本不含真实用户名
